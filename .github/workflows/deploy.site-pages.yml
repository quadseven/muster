name: deploy - site to Cloudflare Pages

# Merges to main did not deploy site/ (muster#210). A tag merged in #64 never
# reached production because the only deployment was a manual upload, and the
# page reported no data for weeks with no signal. This job deploys site/ on
# every push to main that touches it, so production follows main.
#
# Repository configuration, never literals (this repo is public):
#   secrets.CLOUDFLARE_API_TOKEN   a token scoped to Cloudflare Pages edit only
#   secrets.CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
#   vars.CF_PAGES_PROJECT          the Pages project name
# A missing value fails the run, so a deploy that did not happen is red on
# the commit rather than silent.

# Push to main only, no workflow_dispatch: a dispatch runs the workflow file
# of whatever branch it names, so an edited branch copy could read the deploy
# token. Only code already on main ever sees it.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'

permissions:
  contents: read

concurrency:
  group: deploy-site-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 01. Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 02. Require the deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CF_PAGES_PROJECT" ] || missing="$missing vars.CF_PAGES_PROJECT"
          if [ -n "$missing" ]; then
            echo "::error::site not deployed: missing repository configuration:$missing"
            exit 1
          fi

      - name: 03. Deploy site/ to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 pages deploy site \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$COMMIT_SHA" \
            --commit-dirty=false
