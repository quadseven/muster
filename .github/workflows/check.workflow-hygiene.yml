name: check - workflow hygiene

# Runs the fleet's public workflow-hygiene linter on every PR that touches
# this repo's workflows, and fails the PR on any violation. Before this check
# existed, muster main carried 21 violations nobody was told about: five
# floating action tags (two of them in the job that writes the release
# keystore, two in the job that pushes to GHCR), two curl calls with no
# timeout, and fourteen step outputs pasted straight into run: script text.
#
# The linter lives in quadseven/infra-public and is pinned here by SHA; bump
# the pin to pick up newly ported rules.

on:
  pull_request:
    branches: [main]
    # Every file the pinned linter reads is under .github/: workflows, every
    # .sh, and composite actions' action.yml.
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 01. Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 02. Fetch the pinned public linter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: quadseven/infra-public
          ref: 2ee764949a68bed6a1b4b3bcd6785a251f49da8f
          path: .hygiene/infra-public
          persist-credentials: false

      # The scanned-file count is asserted, not just the exit status: a glob
      # that silently matched nothing would also print "clean". 6 is the
      # number of workflows this file was added alongside. Lower it only when
      # workflows are actually removed.
      - name: 03. Lint workflows
        run: |
          set -euo pipefail
          out=$(python3 -I .hygiene/infra-public/.github/scripts/workflow_hygiene.py) || { echo "$out"; exit 1; }
          echo "$out"
          n=$(printf '%s\n' "$out" | sed -n 's/.*clean (\([0-9][0-9]*\) files checked.*/\1/p')
          if [ -z "$n" ] || [ "$n" -lt 6 ]; then
            echo "::error::workflow-hygiene scanned ${n:-no} files, expected at least 6 - a sweep that matches nothing must not pass as clean"
            exit 1
          fi
