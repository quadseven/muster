name: server

# The enrollment exchange and the provisioning preflight are the two places
# muster decides something, and both are pure logic behind an injected seam
# precisely so they can be tested with no device and no network. That only
# counts for anything if the tests run on every change, so this workflow is what
# makes them a gate rather than a habit.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'agent/android/app/src/main/AndroidManifest.xml'
      - 'agent/android/app/build.gradle.kts'
      - '.github/workflows/check.server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'agent/android/app/src/main/AndroidManifest.xml'
      - 'agent/android/app/build.gradle.kts'
      - '.github/workflows/check.server.yml'
  workflow_dispatch:

# The Android manifest and build file are watched deliberately. One test here
# asserts the admin component string in provision.py still matches what the APK
# actually ships - rename the receiver without that test running and the mismatch
# surfaces on a wiped phone with a cable in hand.

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: server tests
    # A FORK PULL REQUEST NEVER REACHES THIS RUNNER.
    #
    # This job runs on hardware inside a home network, and `pull_request` fires
    # for forks. Without this guard, going public would mean any stranger's
    # first PR executes their `pytest` invocation - and anything their own
    # conftest imports at collection time - on that machine, before a human has
    # read a line of it. No secret is needed for that to be bad: code execution
    # on the runner is the loss, not what the runner happens to hold.
    #
    # SAME-REPOSITORY BRANCHES ONLY, which is exactly the writer set. A branch
    # in this repository can only be pushed by someone with write access, so
    # this condition keeps the runner's trust boundary identical to the one it
    # had while the repository was private - the precondition
    # docs/signing-ceremony.md accepted its residual risk on. Going public no
    # longer widens it.
    #
    # SKIPPED, NOT FAILED, for a fork: the check reports as skipped rather than
    # red, so an outside contributor is not shown a failure they cannot fix.
    # `build.server-image.yml` is their signal - it runs on a GitHub-hosted
    # runner, builds this server, and asserts against the built image.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pytest
        # --python 3.12 pinned rather than whatever the runner happens to have:
        # the mini currently carries 3.14, and a test suite that silently moves
        # interpreter when homebrew updates is a suite that fails for reasons
        # nobody changed.
        run: uv run --group dev --python 3.12 python -m pytest -q
