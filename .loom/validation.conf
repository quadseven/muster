# lint: no pull-request run step
# format: no pull-request run step
# type: no pull-request run step
# test: .github/workflows/check.server.yml :: pytest
# affected: .github/workflows/check.agent-android.yml :: The agent and the server must agree which files may travel
interpreter: uv
submodules: no
check: cd server && uv run --group dev --python 3.12 python -m pytest -q
affected: printf '%s\n' "$LOOM_CHANGED_FILES" | grep -qE '^(agent/android/|\.github/workflows/check\.agent-android\.yml$)' || exit 0; (cd agent/android/app && bash ../../tools/jvm-tests.sh) || exit 1; cd server && set -euo pipefail && NAMES=../agent/android/app/build/cross-language/agent-managed-files.json && [ -f "$NAMES" ] || { echo "::error::the JVM test did not write the managed-file names"; exit 1; } && uv run --group dev --python 3.12 python tools/check_managed_files.py "$NAMES"
